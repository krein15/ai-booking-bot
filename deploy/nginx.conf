# /etc/nginx/sites-available/booking-bot
# Замените bot.example.ru на свой поддомен, затем:
#   ln -s /etc/nginx/sites-available/booking-bot /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bot.example.ru      # HTTPS от Let's Encrypt

server {
    listen 80;
    server_name bot.example.ru;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: так посетитель не подменит свой IP для лимитов
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответ модели с вызовами функций и очередью может идти до минуты
        proxy_read_timeout 120s;
    }
}

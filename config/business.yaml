# Настройки демо-бизнеса. Чтобы показать бота клиенту из другой ниши,
# достаточно поменять этот файл: услуги, запчасти, часы работы, вопросы и поля записи.

business:
  name: "Автосервис «Демо Мотор»"
  niche: "автосервис"
  city: "Екатеринбург"
  address: "ул. Демонстрационная, 1 (адрес вымышленный), заезд со двора, своя парковка"
  phone: "+7 (900) 000-00-00"
  timezone: "Asia/Yekaterinburg"
  about: >-
    Автосервис на 3 подъёмника, работаем без выходных. Обслуживаем легковые автомобили
    и кроссоверы любых марок: японские, корейские, европейские, китайские и отечественные.
    Грузовые автомобили и электромобили не обслуживаем. Гарантия на работы — 6 месяцев,
    на запчасти, купленные у нас, — по гарантии производителя (обычно 12 месяцев).
    Запчасти подбираем по VIN, большинство есть на складе, остальное привозим за 1 день.

assistant:
  name: "Ева"
  gender: "female"          # female / male — в каком роде бот говорит о себе
  greeting: >-
    Здравствуйте! Я Ева, администратор автосервиса «Демо Мотор».
    Помогу подобрать услугу и запчасти и записаться на удобное время. Что случилось с машиной?
  quick_replies:
    - "Хочу поменять масло на этой неделе"
    - "Стучит подвеска, когда можно приехать?"
    - "Нужно поменять колодки, какие есть варианты?"
  # Фраза о демо-режиме: бот говорит её один раз, когда спрашивает телефон.
  demo_note: "Это демо-версия: имя и телефон можно указать вымышленные."

booking:
  slot_minutes: 30          # шаг сетки расписания
  posts: 3                  # сколько машин обслуживается одновременно
  horizon_days: 14          # на сколько дней вперёд открыта запись
  min_lead_minutes: 60      # ближайшая запись — не раньше чем через час
  # Средняя «чужая» занятость. Она разная по дням и часам: утро и вечер плотнее,
  # выходные загружены сильнее, некоторые дни почти свободны.
  demo_busy_ratio: 0.5
  max_bookings_per_session: 3

working_hours:              # без выходных; null — выходной
  mon: "08:00-21:00"
  tue: "08:00-21:00"
  wed: "08:00-21:00"
  thu: "08:00-21:00"
  fri: "08:00-21:00"
  sat: "09:00-20:00"
  sun: "09:00-20:00"


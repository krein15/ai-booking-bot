# Справочник неисправностей: бот сверяется с ним, когда клиент описывает проблему.
# causes — от самой вероятной к менее вероятной; danger — предупреждение, если ехать опасно;
# ask — уточняющие вопросы; services — что предложить, первой идёт диагностика.
symptom_guide:
  brakes:
    title: "Тормоза"
    items:
      - signs: ["горит красный индикатор тормозов (восклицательный знак в круге)", "педаль проваливается, продавливается или стала мягкой", "следы жидкости у колёс или под машиной", "уровень в бачке ниже MIN"]
        causes: ["утечка тормозной жидкости: шланг, трубка, суппорт или рабочий цилиндр", "воздух в тормозной системе", "износ главного тормозного цилиндра — педаль медленно уходит в пол, если её держать"]
        danger: "Ехать своим ходом опасно: тормоза могут отказать в любой момент. Лучше вызвать эвакуатор."
        ask: ["Есть ли масляные следы у колёс или под машиной?", "Педаль уходит в пол сразу или постепенно, если её держать?"]
        services: [brake_diag, brake_fluid]
      - signs: ["скрип или визг при торможении", "скрежет металла при торможении", "горит индикатор износа колодок"]
        causes: ["колодки изношены до сигнализатора или до металла — скрежет портит диски", "загрязнение или остекленение колодок"]
        danger: "При скрежете металла тормозной путь растёт, а диски быстро портятся — откладывать не стоит."
        ask: ["Скрипит постоянно или только при торможении?", "Когда меняли колодки?"]
        services: [brake_diag, brake_pads, brake_discs]
      - signs: ["бьёт в руль или педаль при торможении", "вибрация при торможении со скорости"]
        causes: ["деформированы (повело) тормозные диски", "неравномерный износ дисков"]
        ask: ["Бьёт в руль (передние диски) или в педаль и кузов (задние)?"]
        services: [brake_diag, brake_discs]
      - signs: ["уводит в сторону при торможении", "одно колесо сильно греется после поездки"]
        causes: ["закис суппорт или направляющие", "неравномерный износ колодок", "разное давление в шинах"]
        services: [brake_diag, brake_pads]
      - signs: ["горит жёлтый индикатор ABS"]
        causes: ["неисправен датчик ABS или его проводка", "ошибка блока ABS"]
        danger: "Обычные тормоза работают, но ABS отключена — при резком торможении колёса могут заблокироваться."
        services: [computer_diag]
  suspension:
    title: "Подвеска и ходовая"
    items:
      - signs: ["стук спереди на неровностях", "глухой стук на кочках и в ямах"]
        causes: ["изношены стойки стабилизатора — самая частая причина", "втулки стабилизатора", "шаровые опоры", "амортизаторы или опорные подшипники"]
        ask: ["Стучит на мелких неровностях или на крупных ямах?", "Слева, справа или по центру?"]
        services: [suspension_diag, stabilizer_links, shocks]
      - signs: ["машину раскачивает и долго качает после кочки", "амортизатор подтекает", "пробивает подвеску"]
        causes: ["изношены амортизаторы"]
        ask: ["Какой пробег на текущих амортизаторах?"]
        services: [suspension_diag, shocks]
      - signs: ["уводит в сторону на прямой", "руль стоит криво", "шины изнашиваются неравномерно"]
        causes: ["сбит развал-схождение", "разное давление в шинах", "износ рулевых наконечников или сайлентблоков"]
        services: [alignment, suspension_diag]
      - signs: ["гул, который растёт со скоростью", "гул меняется в поворотах"]
        causes: ["изношен ступичный подшипник", "шум шин"]
        services: [suspension_diag]
  engine:
    title: "Двигатель и подкапотное пространство"
    items:
      - signs: ["дым или пар из-под капота", "запах гари из-под капота", "что-то горит под капотом"]
        ask_first: true
        ask: ["Какого цвета дым: белый пар, сизый или чёрный?", "Какой запах: сладковатый, горелого масла или горелой проводки и пластика?", "Что показывает стрелка температуры двигателя?"]
        causes:
          - "белый пар со сладковатым запахом, стрелка температуры растёт — антифриз: лопнул патрубок, течёт радиатор или бачок, перегрев. Самая частая причина"
          - "едкий запах горелого пластика, чёрный дым — замыкание проводки, риск возгорания"
          - "сизый дым с запахом горелого масла — масло на горячих деталях. Бывает редко: пролили масло при доливке, лопнула трубка масляного радиатора, потекла прокладка клапанной крышки"
        danger: "Остановитесь и заглушите двигатель. Капот открывайте осторожно — может обжечь паром. Если видно пламя, отойдите от машины и звоните 112. Дальше лучше на эвакуаторе."
        services: [inspection, coolant]
      - signs: ["резко ушло масло", "из двигателя хлещет масло", "большая лужа масла под машиной"]
        causes: ["серьёзная поломка двигателя: заклинило двигатель или повреждён блок — обычно вместе со стуком и потерей мощности", "лопнула трубка масляного радиатора или сорвало масляный фильтр"]
        danger: "Не заводите двигатель: без масла он разрушится за минуты. Только эвакуатор."
        ask: ["Был ли стук в двигателе перед этим или двигатель заглох?"]
        services: [inspection]
      - signs: ["горит красная маслёнка", "горит индикатор давления масла"]
        causes: ["низкий уровень масла", "падение давления масла: насос, датчик, засор"]
        danger: "Заглушите двигатель и не ездите: без давления масла мотор можно убить за несколько минут. Лучше эвакуатор."
        ask: ["Проверяли уровень масла по щупу?"]
        services: [inspection, oil]
      - signs: ["горит Check Engine", "горит жёлтый значок двигателя"]
        causes: ["ошибка датчика (лямбда-зонд, датчик кислорода, массового расхода воздуха)", "проблемы с зажиганием", "неплотно закрыта крышка бака"]
        danger: "Если Check Engine мигает — это пропуски зажигания, долго ехать нельзя: перегреется катализатор."
        ask: ["Индикатор горит постоянно или мигает?", "Изменилось ли поведение машины?"]
        services: [computer_diag]
      - signs: ["двигатель троит", "трясёт на холостых", "пропала мощность", "дёргается при разгоне"]
        causes: ["изношены свечи зажигания", "неисправна катушка зажигания", "загрязнены форсунки", "подсос воздуха"]
        ask: ["Когда меняли свечи?"]
        services: [computer_diag, spark_plugs]
      - signs: ["плохо заводится в мороз", "стартер крутит медленно", "щёлкает и не заводится"]
        causes: ["разряжен или изношен аккумулятор", "окислены клеммы", "неисправен стартер"]
        ask: ["Сколько лет аккумулятору?"]
        services: [battery, inspection]
      - signs: ["стучит двигатель", "стук в моторе", "цокает под капотом"]
        ask_first: true
        ask: ["Стучит на холодную и проходит после прогрева или на горячую тоже?", "Стук звонкий или глухой, усиливается ли с оборотами?", "Горит ли индикатор давления масла?"]
        causes:
          - "звонкое цоканье на холодную, проходит после прогрева — гидрокомпенсаторы, часто не опасно"
          - "стук на горячую при низком уровне масла — масляное голодание"
          - "глухой стук, растёт с оборотами — износ вкладышей коленвала, серьёзная поломка"
        danger: "Если стук глухой и растёт с оборотами или горит маслёнка — заглушите двигатель и не ездите: может заклинить."
        services: [inspection]
      - signs: ["запах бензина в салоне", "запах бензина под капотом", "подтекает топливо"]
        causes: ["утечка топлива: шланги, топливная рампа, форсунки", "негерметична крышка или горловина бака"]
        danger: "Риск возгорания: не заводите машину, не курите рядом, проветрите салон. Лучше эвакуатор."
        services: [inspection]
      - signs: ["стартер крутит, но двигатель не заводится", "не схватывает при запуске"]
        causes: ["не подаётся топливо: топливный насос, реле, фильтр", "нет искры: свечи, катушка", "неисправен датчик коленвала"]
        ask: ["Слышен ли гул топливного насоса при включении зажигания?", "Бензина в баке достаточно?"]
        services: [computer_diag]
      - signs: ["белый густой дым из выхлопной трубы", "из выхлопа белый дым со сладким запахом"]
        ask_first: true
        ask: ["Дым густой и не проходит после прогрева или только на холодную в мороз?", "Уходит ли антифриз из бачка?"]
        causes:
          - "белый пар на холодную в мороз, исчезает после прогрева — конденсат, это норма"
          - "густой белый дым после прогрева, уходит антифриз — пробита прокладка головки блока, антифриз попадает в цилиндры"
        danger: "Если уходит антифриз и дым густой — не ездите: перегрев и гидроудар разрушат двигатель."
        services: [inspection]
      - signs: ["сизый или синий дым из выхлопной трубы", "двигатель ест масло", "большой расход масла"]
        causes: ["износ маслосъёмных колпачков — дым при старте и сбросе газа", "залегли или износились поршневые кольца", "износ турбины на турбомоторах"]
        ask: ["Сколько масла уходит на 1 000 км?"]
        services: [inspection]
      - signs: ["чёрный дым из выхлопной трубы", "вырос расход топлива"]
        causes: ["переобогащённая смесь: форсунки, датчик кислорода или расхода воздуха", "забит воздушный фильтр"]
        services: [computer_diag, maintenance]
      - signs: ["свист под капотом", "свистит ремень", "визжит при запуске двигателя", "свистит при повороте руля или включении кондиционера"]
        ask_first: true
        ask: ["Когда свистит: при запуске на холодную и потом проходит, при повороте руля, при включении кондиционера или постоянно?", "Свист усиливается с оборотами?"]
        causes:
          - "проскальзывает приводной (навесной) ремень генератора — ослаб, растянулся или износился. Самая частая причина, особенно на холодную и в сырость"
          - "изношен натяжной или обводной ролик — свист или вой постоянно и растёт с оборотами"
          - "свист при повороте руля — ремень или насос гидроусилителя; при включении кондиционера — ремень или муфта компрессора"
        services: [inspection, drive_belt]
      - signs: ["ремень ГРМ не меняли больше 60–90 тыс. км", "подошёл срок замены ГРМ по пробегу", "купил машину с пробегом, не знаю, когда меняли ГРМ"]
        causes: ["плановая замена ремня ГРМ по регламенту производителя — сам по себе ремень ГРМ обычно не свистит, он закрыт кожухом"]
        danger: "Если ремень ГРМ оборвётся, на многих моторах гнутся клапаны — ремонт в разы дороже замены."
        ask: ["Какой пробег и знаете ли, когда меняли ремень ГРМ в последний раз?"]
        services: [timing_belt]
  cooling:
    title: "Охлаждение"
    items:
      - signs: ["стрелка температуры в красной зоне", "белый пар из-под капота", "горит красный индикатор температуры"]
        causes: ["утечка антифриза: патрубок, радиатор, бачок", "неисправен термостат", "не включается вентилятор радиатора", "износ помпы"]
        danger: "Остановитесь и заглушите двигатель: перегрев ведёт к пробою прокладки головки блока. Не открывайте горячий бачок антифриза. Дальше — на эвакуаторе."
        ask: ["Уровень антифриза в бачке в норме?", "Есть ли сладковатый запах или подтёки под машиной?"]
        services: [inspection, coolant]
      - signs: ["уходит антифриз", "лужа со сладким запахом под машиной"]
        causes: ["подтекает патрубок или хомут", "течь радиатора", "износ помпы"]
        services: [inspection, coolant]
      - signs: ["печка дует холодным", "плохо греет печка"]
        causes: ["мало антифриза или воздушная пробка в системе", "термостат залип открытым — двигатель долго греется", "неисправна заслонка или кран печки"]
        ask: ["Стрелка температуры двигателя доходит до середины?"]
        services: [inspection, coolant]
      - signs: ["потеют стёкла изнутри", "сладкий запах в салоне", "мокрый коврик у переднего пассажира"]
        causes: ["течёт радиатор печки"]
        services: [inspection]
  leaks:
    title: "Утечки: лужа или пятно под машиной"
    items:
      - signs: ["лужа под машиной", "что-то капает под машиной", "пятно на парковке"]
        ask_first: true
        ask: ["Какого цвета жидкость и есть ли запах?", "Где капает: спереди под двигателем, посередине или у колеса?"]
        causes:
          - "зелёная, красная, розовая или оранжевая, сладкий запах — антифриз: патрубок, радиатор, помпа"
          - "прозрачная вода без запаха под передней частью справа — конденсат кондиционера, это норма"
          - "коричневая или чёрная маслянистая под двигателем — моторное масло: прокладка поддона, сальники, фильтр"
          - "красная маслянистая — жидкость АКПП или гидроусилителя руля"
          - "прозрачная или желтоватая маслянистая у колеса — тормозная жидкость, это опасно"
        danger: "Если течёт у колеса и педаль тормоза стала мягкой — это тормозная жидкость, ехать нельзя."
        services: [inspection]
  steering:
    title: "Рулевое управление и трансмиссия"
    items:
      - signs: ["хруст при повороте руля на ходу", "щёлкает в поворотах"]
        causes: ["износ наружного ШРУСа (гранаты), часто из-за порванного пыльника"]
        ask: ["Хрустит только при выкрученном руле?"]
        services: [suspension_diag]
      - signs: ["руль стал тяжёлым", "гудит при повороте руля", "стук в руле на неровностях"]
        causes: ["мало жидкости в гидроусилителе или течь", "износ насоса ГУР или ремня", "износ рулевой рейки или тяг"]
        services: [inspection, suspension_diag]
      - signs: ["коробка-автомат пинается", "рывки при переключении", "АКПП проскальзывает"]
        causes: ["низкий уровень или старое масло в АКПП", "износ гидроблока или фрикционов"]
        ask: ["Когда меняли масло в коробке?"]
        services: [computer_diag, inspection]
  clutch:
    title: "Сцепление"
    items:
      - signs: ["обороты растут, а машина не разгоняется", "запах гари после разгона", "сцепление схватывает высоко"]
        causes: ["изношен диск сцепления"]
        services: [clutch]
      - signs: ["тяжело включаются передачи", "шум при нажатии на педаль сцепления"]
        causes: ["износ выжимного подшипника", "сцепление не полностью выключается"]
        services: [clutch]
  electrics:
    title: "Электрика"
    items:
      - signs: ["горит значок аккумулятора на ходу", "тускнеют фары, садится аккумулятор"]
        causes: ["неисправен генератор или его ремень", "изношен аккумулятор"]
        danger: "Машина едет на остатке заряда аккумулятора и может заглохнуть в дороге."
        services: [battery, inspection]
  ac:
    title: "Кондиционер"
    items:
      - signs: ["кондиционер дует тёплым", "кондиционер плохо холодит"]
        causes: ["мало хладагента из-за утечки", "неисправен компрессор или его муфта"]
        services: [ac]
  tires:
    title: "Колёса и шины"
    items:
      - signs: ["вибрация в руле на скорости 80–110 км/ч"]
        causes: ["нужна балансировка колёс", "деформирован диск колеса"]
        services: [tires]

# Что ещё спросить у клиента кроме имени и телефона.
extra_fields:
  - id: car
    label: "Автомобиль"
    description: "Марка, модель и год выпуска, например «Kia Rio 2017»"
    required: true

faq:
  - q: "Работаете в выходные?"
    a: "Да, без выходных: будни с 8:00 до 21:00, суббота и воскресенье с 9:00 до 20:00."
  - q: "Можно подождать в сервисе?"
    a: "Да, есть клиентская зона с кофе, Wi-Fi и окном в цех."
  - q: "Как оплатить?"
    a: "Наличными, картой или по СБП после выполнения работ. Для юрлиц — по счёту."
  - q: "Можно со своими запчастями?"
    a: "Да, но гарантия тогда только на работу, не на детали."
  - q: "Сколько длится ремонт?"
    a: "Ориентир указан в списке услуг. Точнее скажет мастер после осмотра."
  - q: "Есть эвакуатор?"
    a: "Да, партнёрский, от 2 500 ₽ по городу. Можно заказать через администратора."
  - q: "Делаете скидки?"
    a: "При записи через сайт или бота — скидка 5% на работы. Пенсионерам — 10%."
  - q: "Покажете старые детали?"
    a: "Да, все снятые детали отдаём клиенту или показываем по запросу."
  - q: "Сколько ждать запчасти?"
    a: "Ходовые позиции на складе, остальное привозим за 1 рабочий день."

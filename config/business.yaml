    price_from: 1200
    parts: brake_pads
  - id: brake_discs
    name: "Замена тормозных дисков и колодок (одна ось)"
    duration_min: 90
    price_from: 2500
    parts: brake_discs
  - id: brake_fluid
    name: "Замена тормозной жидкости"
    duration_min: 30
    price_from: 900
    parts: brake_fluid
  - id: brake_diag
    name: "Диагностика тормозной системы"

    price_from: 3000
    parts: shocks
  - id: stabilizer_links
    name: "Замена стоек стабилизатора (пара)"
    duration_min: 60
    price_from: 1200
    parts: stabilizer_links
  - id: alignment
    name: "Развал-схождение"
    duration_min: 60
    price_from: 1800
  - id: inspection
    name: "Осмотр и поиск неисправности мастером"
    duration_min: 30
    price_from: 500
    note: "дым, утечки, посторонние звуки — когда причина неясна"
  - id: computer_diag
    name: "Компьютерная диагностика"
    duration_min: 30
    price_from: 900
    note: "горит Check Engine, ошибки, троит двигатель"
  - id: spark_plugs
    name: "Замена свечей зажигания"
    duration_min: 30
    price_from: 800
    parts: spark_plugs
  - id: battery
    name: "Замена аккумулятора с проверкой генератора"
    duration_min: 30
    price_from: 400
    parts: battery
  - id: clutch
    name: "Замена сцепления"
    duration_min: 240
    price_from: 8500
    note: "цена зависит от коробки и привода"
    parts: clutch_kit
  - id: coolant
    name: "Замена антифриза с промывкой"
    duration_min: 60
    price_from: 1500
    parts: coolant
  - id: tires
    name: "Шиномонтаж и балансировка, 4 колеса"
    duration_min: 60
    price_from: 2200
    note: "R13–R16; R17 и больше — от 2 800 ₽"
  - id: ac
    name: "Заправка кондиционера с проверкой на утечки"

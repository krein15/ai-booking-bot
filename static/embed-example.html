<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример встраивания</title>
  <style>
    body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; background: #fafafa; color: #222; }
    main { max-width: 720px; margin: 0 auto; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } code { background: #222; } }
  </style>
</head>
<body>
  <main>
    <h1>Так виджет выглядит на чужом сайте</h1>
    <p>Кнопка чата — в правом нижнем углу. На сайт достаточно добавить одну строку:</p>
    <p><code>&lt;script src="https://ваш-домен/widget.js" defer&gt;&lt;/script&gt;</code></p>
  </main>
  <script src="/widget.js" defer></script>
</body>
</html>
